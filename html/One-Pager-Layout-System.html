document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));

    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

6FF;\">Design system<\u002Fdiv>\n    <h1 style=\"font-size:30px;font-weight:800;color:#151A28;margin-top:8px;line-height:1.1;\">One-Pager Layout System<\u002Fh1>\n    <p style=\"font-size:14px;font-weight:400;color:#41506E;line-height:1.55;margin-top:12px;max-width:900px;\">A fixed narrative structure and a catalog of approved, swappable blocks for building a single-page proposal or assessment one-pager. Examples below are generic \u2014 swap in real content per project. An agent assembles a page by choosing <b style=\"font-weight:600;\">exactly one block per section<\u002Fb> from the options shown here, in order, and applying the shared tokens + transition system. Build rules live in <b style=\"font-weight:600;color:#1966FF;\">One-Pager Skill.md<\u002Fb>.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;\">\n      <span style=\"background:#0C1626;color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;\">960px \u00b7 one Letter page<\u002Fspan>\n      <span style=\"background:#fff;border:1px solid #D5DEF2;color:#1A2440;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;\">Print + screen<\u002Fspan>\n      <span style=\"background:#fff;border:1px solid #D5DEF2;color:#1A2440;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;\">\u226420s readability per section<\u002Fspan>\n      <span style=\"background:#fff;border:1px solid #D5DEF2;color:#1A2440;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;\">Headline + one hero number<\u002Fspan>\n      <span style=\"background:#fff;border:1px solid #D5DEF2;color:#1A2440;font-size:11px;font-weight:600;padding:6px 12px;border-radius:999px;\">Dark header + footer frame<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 TOKENS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n  <div style=\"background:#fff;border:1px solid #E2E8F4;border-radius:16px;padding:24px 26px;box-shadow:0 12px 30px rgba(20,30,60,.08);max-width:1200px;\">\n    <div class=\"vlab\" style=\"color:#151A28;\">Tokens<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 1fr;gap:30px;margin-top:16px;\">\n      <!-- colors -->\n      <div>\n        <div style=\"font-size:12px;font-weight:700;color:#1A2440;margin-bottom:10px;\">Beat accents \u2014 one fixed color per section<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;\">\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#1966FF;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Setup / TL;DR<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#1966FF<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#8B1DC0;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Problem \u00b7 01<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#8B1DC0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#1A7A70;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Guide \u00b7 02<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#1A7A70<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#5E28E5;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Plan \u00b7 03<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#5E28E5<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#C93FDB;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Stakes \u00b7 04<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#C93FDB<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:26px;height:26px;border-radius:6px;background:#0C1626;flex-shrink:0;\"><\u002Fspan><div><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Frame \u00b7 header/footer<\u002Fdiv><div style=\"font-size:9px;color:#6F747F;font-family:monospace;\">#0C1626<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;color:#1A2440;margin:16px 0 8px;\">Neutrals &amp; tints<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#151A28;\" title=\"#151A28 ink\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#41506E;\" title=\"#41506E slate\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#6F747F;\" title=\"#6F747F gray\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#E2E8F4;\" title=\"#E2E8F4 line\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#F8F9FC;border:1px solid #E2E8F4;\" title=\"#F8F9FC panel\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#EEF3FF;border:1px solid #D5DEF2;\" title=\"#EEF3FF ice\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#F0FAF8;border:1px solid #CFE9E4;\" title=\"#F0FAF8 mint\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#FDF0FF;border:1px solid #F0D6F6;\" title=\"#FDF0FF blush\"><\u002Fspan>\n          <span style=\"width:34px;height:34px;border-radius:6px;background:#F3EEFF;border:1px solid #E0D4FA;\" title=\"#F3EEFF lilac\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;color:#1A2440;margin:16px 0 8px;\">Signature gradient (masthead underline only)<\u002Fdiv>\n        <div style=\"height:12px;border-radius:6px;background:linear-gradient(90deg,#3BACF0,#1966FF,#5E28E5,#C93FDB);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- type -->\n      <div>\n        <div style=\"font-size:12px;font-weight:700;color:#1A2440;margin-bottom:10px;\">Type \u2014 Figtree<\u002Fdiv>\n        <div style=\"border:1px solid #E2E8F4;border-radius:10px;padding:14px 16px;\">\n          <div style=\"font-size:28px;font-weight:800;color:#151A28;line-height:1;\">Display 800<\u002Fdiv>\n          <div style=\"font-size:16px;font-weight:600;color:#1A2440;margin-top:10px;\">Title / lead 600<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:400;color:#41506E;margin-top:8px;line-height:1.5;\">Body copy sits at 11\u201313px, weight 300\u2013400, line-height ~1.5. Kept short so a section reads in seconds.<\u002Fdiv>\n          <div class=\"vlab\" style=\"color:#1966FF;margin-top:10px;\">Eyebrow \u00b7 9px 700 tracked<\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;gap:6px;margin-top:10px;\"><span style=\"font-size:30px;font-weight:800;color:#1A7A70;\">30<\u002Fspan><span style=\"font-size:12px;color:#6F747F;\">hero stat \u00b7 20\u201330px 800<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:9.5px;color:#6F747F;line-height:1.5;margin-top:12px;\"><b style=\"color:#1A2440;font-weight:700;\">Min sizes:<\u002Fb> body \u226511px on screen / \u226512pt print \u00b7 hero stats \u226520px \u00b7 eyebrows \u22659px. One page, 960px wide.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 STRUCTURE + TRANSITIONS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 -->\n  <div style=\"display:flex;gap:26px;align-items:flex-start;\">\n    <div style=\"width:400px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:14px;padding:18px 20px 20px;box-shadow:0 12px 30px rgba(20,30,60,.08);\">\n      <div class=\"vlab\" style=\"color:#151A28;\">Fixed structure \u00b7 top \u2192 bottom<\u002Fdiv>\n      <p style=\"font-size:10.5px;color:#6F747F;margin-top:4px;line-height:1.4;\">Always this order. Choose one block per beat. Dark frame opens and closes.<\u002Fp>\n      <div style=\"margin-top:14px;position:relative;padding-left:26px;\">\n        <div style=\"position:absolute;left:7px;top:6px;bottom:6px;width:3px;border-radius:2px;background:linear-gradient(#0C1626,#1966FF,#8B1DC0,#1A7A70,#5E28E5,#C93FDB,#0C1626);\"><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#0C1626;border:3px solid #fff;box-shadow:0 0 0 1px #0C1626;\"><\u002Fspan><div style=\"background:#0C1626;border-radius:6px;padding:6px 10px;\"><div class=\"vlab\" style=\"color:rgba(255,255,255,.55);font-size:8px;\">Header \u00b7 frame<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#fff;\">Dark masthead<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#1966FF;border:3px solid #fff;box-shadow:0 0 0 1px #1966FF;\"><\u002Fspan><div style=\"background:#EEF3FF;border-left:3px solid #1966FF;border-radius:0 6px 6px 0;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#1966FF;font-size:8px;\">TL;DR \u00b7 setup<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Whole page in one breath<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#8B1DC0;border:3px solid #fff;box-shadow:0 0 0 1px #8B1DC0;\"><\u002Fspan><div style=\"background:#FDF0FF;border-left:3px solid #8B1DC0;border-radius:0 6px 6px 0;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#8B1DC0;font-size:8px;\">01 \u00b7 problem<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Name the pain + its cost<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#1A7A70;border:3px solid #fff;box-shadow:0 0 0 1px #1A7A70;\"><\u002Fspan><div style=\"background:#F0FAF8;border-left:3px solid #1A7A70;border-radius:0 6px 6px 0;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#1A7A70;font-size:8px;\">02 \u00b7 guide<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">The fix already exists<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#5E28E5;border:3px solid #fff;box-shadow:0 0 0 1px #5E28E5;\"><\u002Fspan><div style=\"background:#F3EEFF;border-left:3px solid #5E28E5;border-radius:0 6px 6px 0;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#5E28E5;font-size:8px;\">03 \u00b7 plan<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Phased, low-risk path<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;margin-bottom:11px;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#C93FDB;border:3px solid #fff;box-shadow:0 0 0 1px #C93FDB;\"><\u002Fspan><div style=\"background:#FDF0FF;border-left:3px solid #C93FDB;border-radius:0 6px 6px 0;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#C93FDB;font-size:8px;\">04 \u00b7 stakes<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#1A2440;\">Risk vs. success (light)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <div style=\"position:relative;\"><span style=\"position:absolute;left:-26px;top:2px;width:15px;height:15px;border-radius:50%;background:#0C1626;border:3px solid #fff;box-shadow:0 0 0 1px #0C1626;\"><\u002Fspan><div style=\"background:#0C1626;border-radius:6px;padding:6px 10px;\"><div class=\"vlab\" style=\"color:#8FB4FF;font-size:8px;\">05 \u00b7 takeaway + footer<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#fff;\">Remember + close the frame<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:1054px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:14px;padding:18px 22px;box-shadow:0 12px 30px rgba(20,30,60,.08);\">\n      <div class=\"vlab\" style=\"color:#151A28;\">Transition system \u2014 makes any combination read as one page<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px;\">\n        <div style=\"border:1px solid #E2E8F4;border-radius:10px;padding:12px 14px;\">\n          <div style=\"height:34px;border-radius:6px;background:linear-gradient(90deg,#0C1626,#1966FF,#8B1DC0,#1A7A70,#5E28E5,#C93FDB,#0C1626);margin-bottom:10px;\"><\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#1A2440;\">1 \u00b7 Dark frame + color handoff<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#6F747F;line-height:1.45;margin-top:3px;\">Wave-textured dark masthead + footer bracket the page; each beat's accent seeds the next, pulling the eye forward.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E2E8F4;border-radius:10px;padding:12px 14px;\">\n          <div style=\"height:34px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;\"><span style=\"width:20px;height:20px;border-radius:50%;background:#1A7A70;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;\">02<\u002Fspan><span style=\"flex:1;max-width:70px;height:2px;background:#CBD5E8;\"><\u002Fspan><span style=\"width:26px;height:26px;border-radius:50%;background:#5E28E5;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;\">03<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#1A2440;\">2 \u00b7 Numbered nodes<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#6F747F;line-height:1.45;margin-top:3px;\">A numbered node in the beat's accent opens every section \u2014 a constant anchor across layouts.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E2E8F4;border-radius:10px;padding:12px 14px;\">\n          <div style=\"height:34px;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-bottom:10px;\"><div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"font-size:7px;color:#9AA3B5;letter-spacing:.08em;width:52px;\">header<\u002Fspan><div style=\"flex:1;height:3px;background:linear-gradient(90deg,#3BACF0,#1966FF,#5E28E5,#C93FDB);border-radius:2px;\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"font-size:7px;color:#9AA3B5;letter-spacing:.08em;width:52px;\">beats<\u002Fspan><div style=\"flex:1;height:1px;background:#E2E8F4;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#1A2440;\">3 \u00b7 Gradient under the header only<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#6F747F;line-height:1.45;margin-top:3px;\">The gradient underlines the masthead. Between beats, use a thin neutral hairline \u2014 no gradient dividers.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;background:#EEF3FF;border:1px solid #D5DEF2;border-radius:10px;padding:12px 16px;font-size:11.5px;color:#1A2440;line-height:1.5;\"><b style=\"font-weight:700;\">Catalog rules:<\u002Fb> pick exactly one block per beat, only from the options shown below. TL;DR is a single fixed layout. Section 04 is always light (no dark band). Header &amp; Footer must both be dark to frame the print.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CATALOG: HEADER \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div style=\"display:flex;gap:22px;align-items:flex-start;padding-top:10px;border-top:2px solid #CBD5E8;\">\n    <div style=\"width:210px;flex-shrink:0;padding-top:6px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:11px;height:11px;border-radius:2px;background:#0C1626;\"><\u002Fspan><span class=\"vlab\" style=\"color:#1A2440;\">Header \u00b7 frame<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:#151A28;margin-top:6px;\">Dark masthead<\u002Fdiv>\n      <div style=\"font-size:11px;color:#6F747F;line-height:1.5;margin-top:6px;\">Choose one. Slots: eyebrow (category \u00b7 client), title (initiative + promise), meta (owners \u00b7 date). Dynatrace wave art sits under a left-dark overlay on every dark frame block.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;\">\n      <!-- HdrA -->\n      <div style=\"width:560px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#0C1626;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">HdrA<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Lockup + title<\u002Fspan><\u002Fdiv>\n        <div>\n          <div class=\"dkwave\" style=\"padding:20px 24px;display:flex;align-items:center;gap:18px;\">\n            <div style=\"flex-shrink:0;line-height:1;\"><span style=\"font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em;\">Wordmark<\u002Fspan><\u002Fdiv>\n            <div style=\"width:1px;height:36px;background:rgba(255,255,255,.22);flex-shrink:0;\"><\u002Fdiv>\n            <div><div class=\"vlab\" style=\"font-size:9px;color:rgba(255,255,255,.5);\">Category \u00b7 Client name<\u002Fdiv><div style=\"font-size:17px;font-weight:500;color:#fff;margin-top:5px;line-height:1.2;\">Initiative Name \u2014 the one-line promise<\u002Fdiv><div style=\"font-size:10px;font-weight:300;color:rgba(255,255,255,.55);margin-top:5px;\">Owner Name, Title \u00b7 Owner Name, Title \u00b7 Date<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:4px;background:linear-gradient(90deg,#3BACF0,#1966FF,#5E28E5,#C93FDB);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> the brand/logo should lead and the title is short enough for one line.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- HdrB -->\n      <div style=\"width:490px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#0C1626;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">HdrB<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Title left \u00b7 meta right<\u002Fspan><\u002Fdiv>\n        <div>\n          <div class=\"dkwave\" style=\"padding:18px 22px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:18px;\">\n              <div><div class=\"vlab\" style=\"font-size:9px;color:#8FB4FF;\">Category \u00b7 Client name<\u002Fdiv><div style=\"font-size:18px;font-weight:600;color:#fff;margin-top:6px;line-height:1.18;\">Initiative Name<br>The one-line promise<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:right;font-size:9px;font-weight:300;color:rgba(255,255,255,.55);line-height:1.55;flex-shrink:0;padding-top:3px;\">Owner Name<br>Title<br>Owner Name<br>Title<br>Date<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:3px;border-radius:2px;background:linear-gradient(90deg,#3BACF0,#1966FF,#5E28E5,#C93FDB);margin-top:14px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> the title needs two lines or there are several owners/roles to list.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CATALOG: TL;DR \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div style=\"display:flex;gap:22px;align-items:flex-start;padding-top:10px;border-top:1px solid #CBD5E8;\">\n    <div style=\"width:210px;flex-shrink:0;padding-top:6px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#1966FF;\"><\u002Fspan><span class=\"vlab\" style=\"color:#1966FF;\">Summary \u00b7 TL;DR<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:#151A28;margin-top:6px;\">Single fixed layout<\u002Fdiv>\n      <div style=\"font-size:11px;color:#6F747F;line-height:1.5;margin-top:6px;\">No variants. Slots: one-sentence summary + four hero stats (number + label). Tinted setup-blue band, inset from the page edges, with the left rule.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:980px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n      <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#1966FF;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">TL;DR<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Standard summary bar<\u002Fspan><\u002Fdiv>\n      <div style=\"margin:12px 14px;padding:14px 18px;background:#EEF3FF;border-left:4px solid #1966FF;border-radius:0 6px 6px 0;display:grid;grid-template-columns:1.1fr 1.3fr;gap:28px;align-items:center;\">\n        <div>\n          <div class=\"vlab\" style=\"color:#1966FF;margin-bottom:7px;\">TL;DR<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:400;color:#1A2440;line-height:1.5;\">One or two sentences that state the situation, the plan, and the payoff \u2014 <b style=\"font-weight:700;\">the whole page in a single breath.<\u002Fb><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center;\">\n          <div><div style=\"font-size:30px;font-weight:800;color:#1A7A70;line-height:1;\">5<span style=\"font-size:16px;\">/5<\u002Fspan><\u002Fdiv><div style=\"font-size:9.5px;color:#41506E;margin-top:6px;line-height:1.3;\">items ready<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:30px;font-weight:800;color:#1966FF;line-height:1;\">$0<\u002Fdiv><div style=\"font-size:9.5px;color:#41506E;margin-top:6px;line-height:1.3;\">added cost<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:30px;font-weight:800;color:#5E28E5;line-height:1;\">2<\u002Fdiv><div style=\"font-size:9.5px;color:#41506E;margin-top:6px;line-height:1.3;\">decisions to proceed<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:30px;font-weight:800;color:#1A2440;line-height:1;\">30<\u002Fdiv><div style=\"font-size:9.5px;color:#41506E;margin-top:6px;line-height:1.3;\">days to first value<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Always used.<\u002Fb> Keep the sentence under ~40 words; stats are the 4 numbers a reader should leave with.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CATALOG: 01 PROBLEM \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div style=\"display:flex;gap:22px;align-items:flex-start;padding-top:10px;border-top:1px solid #CBD5E8;\">\n    <div style=\"width:210px;flex-shrink:0;padding-top:6px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:22px;height:22px;border-radius:50%;background:#8B1DC0;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;\">01<\u002Fspan><span class=\"vlab\" style=\"color:#8B1DC0;\">Problem<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:#151A28;margin-top:8px;\">Name the pain + cost<\u002Fdiv>\n      <div style=\"font-size:11px;color:#6F747F;line-height:1.5;margin-top:6px;\">Choose one of four. All surface the problem and hint at its cost.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;\">\n      <!-- 01A -->\n      <div style=\"width:460px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#8B1DC0;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">01A<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Bold statement<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:18px 16px;\">\n          <div style=\"font-size:22px;font-weight:800;line-height:1.1;\"><span style=\"color:#1A2440;\">Big claim, line one.<\u002Fspan><br><span style=\"color:#8B1DC0;\">The sharp turn, line two.<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:#41506E;line-height:1.5;margin-top:10px;\">One line of supporting context that sharpens the pain and sets up the cost.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:11px;margin-top:13px;border-top:1px solid #E2E8F4;padding-top:12px;\"><span style=\"font-size:30px;font-weight:800;color:#8B1DC0;line-height:.9;\">100%<\u002Fspan><span style=\"font-size:10.5px;color:#333;line-height:1.35;\">the single stat that quantifies the pain.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> one punchy claim carries the section.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 01B -->\n      <div style=\"width:500px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#8B1DC0;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">01B<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Symptom \u2192 cost table<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px;\">\n          <div style=\"font-size:13px;font-weight:600;color:#1A2440;margin-bottom:11px;\">The problem, and what it's costing<\u002Fdiv>\n          <div style=\"border:1px solid #E2E8F4;border-radius:8px;overflow:hidden;\">\n            <div style=\"display:grid;grid-template-columns:5px 1fr 1fr;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8B1DC0;background:#FBF3FD;\"><div><\u002Fdiv><div style=\"padding:6px 12px;\">Symptom<\u002Fdiv><div style=\"padding:6px 12px;border-left:1px solid #F0D6F6;\">Cost<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:5px 1fr 1fr;border-top:1px solid #E2E8F4;\"><div style=\"background:#C93FDB;\"><\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;\">Symptom one<\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;border-left:1px solid #E2E8F4;\">What it costs the business<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:5px 1fr 1fr;border-top:1px solid #E2E8F4;\"><div style=\"background:#C93FDB;\"><\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;\">Symptom two<\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;border-left:1px solid #E2E8F4;\">What it costs the business<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:5px 1fr 1fr;border-top:1px solid #E2E8F4;\"><div style=\"background:#C93FDB;\"><\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;\">Symptom three<\u002Fdiv><div style=\"padding:8px 12px;font-size:10.5px;color:#333;line-height:1.35;border-left:1px solid #E2E8F4;\">What it costs the business<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> there are 2\u20134 discrete pains each with a clear consequence.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 01C -->\n      <div style=\"width:460px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#8B1DC0;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">01C<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Pull-quote<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:18px 16px;\">\n          <div style=\"border-left:4px solid #8B1DC0;padding-left:14px;\"><div style=\"font-size:18px;font-weight:600;color:#1A2440;line-height:1.3;\">\u201cA sharp quote that frames the pain in a single, human sentence.\u201d<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-top:14px;\">\n            <span style=\"background:#FDF0FF;color:#8B1DC0;font-size:9.5px;font-weight:600;padding:4px 9px;border-radius:5px;\">Context point one<\u002Fspan>\n            <span style=\"background:#FDF0FF;color:#8B1DC0;font-size:9.5px;font-weight:600;padding:4px 9px;border-radius:5px;\">Context point two<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> a stakeholder voice or a memorable line lands the pain best.<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 01D -->\n      <div style=\"width:470px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#8B1DC0;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">01D<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Three-tile snapshot<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px;\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;\">\n            <div style=\"background:#FDF0FF;border-radius:8px;padding:13px 10px;text-align:center;\"><div style=\"font-size:26px;font-weight:800;color:#8B1DC0;line-height:.9;\">100%<\u002Fdiv><div style=\"font-size:9px;color:#333;margin-top:6px;line-height:1.3;\">stat label<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FDF0FF;border-radius:8px;padding:13px 10px;text-align:center;\"><div style=\"font-size:26px;font-weight:800;color:#8B1DC0;line-height:.9;\">0<\u002Fdiv><div style=\"font-size:9px;color:#333;margin-top:6px;line-height:1.3;\">stat label<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FDF0FF;border-radius:8px;padding:13px 10px;text-align:center;\"><div style=\"font-size:26px;font-weight:800;color:#8B1DC0;line-height:.9;\">None<\u002Fdiv><div style=\"font-size:9px;color:#333;margin-top:6px;line-height:1.3;\">stat label<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#41506E;line-height:1.45;margin-top:12px;\">One line that ties the three numbers together.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> three quantified facts make the pain undeniable.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CATALOG: 02 GUIDE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div style=\"display:flex;gap:22px;align-items:flex-start;padding-top:10px;border-top:1px solid #CBD5E8;\">\n    <div style=\"width:210px;flex-shrink:0;padding-top:6px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\"><span style=\"width:22px;height:22px;border-radius:50%;background:#1A7A70;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;\">02<\u002Fspan><span class=\"vlab\" style=\"color:#1A7A70;\">Guide<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:16px;font-weight:700;color:#151A28;margin-top:8px;\">The fix already exists<\u002Fdiv>\n      <div style=\"font-size:11px;color:#6F747F;line-height:1.5;margin-top:6px;\">Choose one of three. Position the solution/guide as the answer to Section 01.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:18px;\">\n      <!-- 02A -->\n      <div style=\"width:520px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#1A7A70;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">02A<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Pain \u2192 capability map<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px;\">\n          <div style=\"display:grid;grid-template-columns:1fr 24px 1fr;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6F747F;margin-bottom:8px;\"><span>The pain<\u002Fspan><span><\u002Fspan><span>Answered by<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"flex:1;background:#FDF0FF;border-radius:7px;padding:8px 11px;font-size:10.5px;color:#333;line-height:1.3;\">Pain one<\u002Fdiv><span style=\"color:#1A7A70;font-size:15px;font-weight:700;\">\u2192<\u002Fspan><div style=\"flex:1;background:#F0FAF8;border-radius:7px;padding:8px 11px;font-size:10.5px;font-weight:600;color:#1A7A70;line-height:1.3;\">Capability A<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;\"><div style=\"flex:1;background:#FDF0FF;border-radius:7px;padding:8px 11px;font-size:10.5px;color:#333;line-height:1.3;\">Pain two<\u002Fdiv><span style=\"color:#1A7A70;font-size:15px;font-weight:700;\">\u2192<\u002Fspan><div style=\"flex:1;background flow:hidden;\">\n            <div style=\"flex:1;background:#FDF0FF;padding:12px 14px;\"><div style=\"font-size:11px;font-weight:700;color:#8B1DC0;margin-bottom:7px;\">If we wait<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;margin-bottom:5px;\">Downside one<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;margin-bottom:5px;\">Downside two<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;\">Downside three<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:center;background:#fff;padding:0 4px;\"><span style=\"font-size:11px;font-weight:800;color:#6F747F;\">VS<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1;background:#F0FAF8;padding:12px 14px;\"><div style=\"font-size:11px;font-weight:700;color:#1A7A70;margin-bottom:7px;\">If we act<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;margin-bottom:5px;\">Upside one<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;margin-bottom:5px;\">Upside two<\u002Fdiv><div style=\"font-size:10px;color:#333;line-height:1.4;\">Upside three<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;background:#1A2440;border-radius:8px;padding:11px 14px;text-align:center;\"><span style=\"font-size:12.5px;font-weight:700;color:#fff;\">The verdict line \u2014 small effort avoids large cost.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> a direct comparison + a one-line verdict is persuasive. (Verdict chip is small \u2014 not a full dark band.)<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- 04D -->\n      <div style=\"width:440px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#C93FDB;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">04D<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Risks \u2715 / Wins \u2713<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px;\">\n          <div style=\"font-size:11px;font-weight:700;color:#8B1DC0;margin-bottom:7px;\">Risk if we don't proceed<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;margin-bottom:4px;\"><span style=\"color:#8B1DC0;font-weight:700;\">\u2715<\u002Fspan> Risk one<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;margin-bottom:4px;\"><span style=\"color:#8B1DC0;font-weight:700;\">\u2715<\u002Fspan> Risk two<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;\"><span style=\"color:#8B1DC0;font-weight:700;\">\u2715<\u002Fspan> Risk three<\u002Fdiv>\n          <div style=\"height:1px;background:#E2E8F4;margin:11px 0;\"><\u002Fdiv>\n          <div style=\"font-size:11px;font-weight:700;color:#1A7A70;margin-bottom:7px;\">What success looks like<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;margin-bottom:4px;\"><span style=\"color:#1A7A70;font-weight:700;\">\u2713<\u002Fspan> Win one<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;margin-bottom:4px;\"><span style=\"color:#1A7A70;font-weight:700;\">\u2713<\u002Fspan> Win two<\u002Fdiv>\n          <div style=\"font-size:10.5px;color:#333;line-height:1.5;\"><span style=\"color:#1A7A70;font-weight:700;\">\u2713<\u002Fspan> Win three<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> a compact single-column checklist fits the space better than a split.<\u002Fdiv>\n      <\u002Fdi #fff;line-height:1.35;\">The one line the exec should leave with \u2014 <span style=\"color:#8FB4FF;\">the ask<\u002Fspan> and <span style=\"color:#5FE0CE;\">the payoff, together.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;margin-top:14px;\">\n              <div style=\"flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 12px;\"><div class=\"vlab\" style=\"color:#8FB4FF;font-size:8px;margin-bottom:2px;\">Decision 1<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#fff;\">The first approval<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 12px;\"><div class=\"vlab\" style=\"color:#C9A8F5;font-size:8px;margin-bottom:2px;\">Decision 2<\u002Fdiv><div style=\"font-size:11px;font-weight:600;color:#fff;\">The second approval<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> the ask is 1\u20132 explicit decisions. The default close.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- 05C -->\n        <div style=\"width:420px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#5E28E5;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">05C<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Takeaway + decision chips<\u002Fspan><\u002Fdiv>\n          <div class=\"dkwave\" style=\"padding:20px;\">\n            <div style=\"font-size:16px;font-weight:600;color:#fff;line-height:1.3;\">A short, confident takeaway line.<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:13px;\">\n              <div style=\"flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;\"><div class=\"vlab\" style=\"color:#8FB4FF;font-size:8px;margin-bottom:3px;\">Decision 1<\u002Fdiv><div style=\"font-size:10.5px;font-weight:600;color:#fff;line-height:1.3;\">Short label<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px 12px;\"><div class=\"vlab\" style=\"color:#C9A8F5;font-size:8px;margin-bottom:3px;\">Decision 2<\u002Fdiv><div style=\"font-size:10.5px;font-weight:600;color:#fff;line-height:1.3;\">Short label<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:10px;color:rgba(255,255,255,.6);margin-top:12px;line-height:1.4;font-style:italic;\">A reassuring one-liner about risk/cost.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> you want a takeaway line + compact decision chips + reassurance.<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- 05D -->\n        <div style=\"width:420px;flex-shrink:0;background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#5E28E5;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">05D<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Minimal one-liner<\u002Fspan><\u002Fdiv>\n          <div class=\"dkwave\" style=\"padding:26px 22px;text-align:center;\">\n            <div style=\"font-size:21px;font-weight:800;color:#fff;line-height:1.2;\">Three-beat<br>takeaway line.<br><span style=\"color:#5FE0CE;\">The payoff.<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:10.5px;color:rgba(255,255,255,.6);margin-top:12px;\">A short qualifier beneath.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Use when<\u002Fb> maximum impact / minimum words; decisions live elsewhere.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- Footer FtrB (always appended) -->\n      <div style=\"background:#fff;border:1px solid #E2E8F4;border-radius:12px;overflow:hidden;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F8F9FC;border-bottom:1px solid #E2E8F4;\"><span style=\"background:#0C1626;color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:4px;\">FtrB<\u002Fspan><span style=\"font-size:11.5px;font-weight:600;color:#1A2440;\">Footer bar \u2014 always appended below the takeaway<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#0C1626;padding:15px 22px;text-align:center;\">\n          <div style=\"width:64px;height:3px;border-radius:2px;background:linear-gradient(90deg,#3BACF0,#1966FF,#5E28E5,#C93FDB);margin:0 auto 11px;\"><\u002Fdiv>\n          <div style=\"font-size:10px;color:rgba(255,255,255,.72);\">\u00a9 Year, Company. &nbsp;\u00b7&nbsp; Confidential<\u002Fdiv>\n          <div style=\"font-size:8.5px;color:rgba(255,255,255,.42);margin-top:5px;line-height:1.4;\">Sources: reference one \u00b7 reference two \u00b7 reference three<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:8px 14px;background:#F8F9FC;border-top:1px solid #E2E8F4;font-size:9px;color:#6F747F;line-height:1.4;\"><b style=\"color:#1A2440;font-weight:700;\">Always used.<\u002Fb> Dark bar closes the frame started by the header. Copyright \u00b7 confidentiality \u00b7 sources.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ASSEMBLY RECIPE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div style=\"background:#0C1626;border-radius:16px;padding:24px 26px;max-width:1120px;color:#fff;\">\n    <div class=\"vlab\" style=\"color:#8FB4FF;\">Assembly<\u002Fdiv>\n    <div style=\"font-size:18px;font-weight:700;margin-top:6px;\">One block per beat, stacked at 960px, transitions applied<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px;\">\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:#8FB4FF;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;\">Rules<\u002Fdiv>\n        <div style=\"font-size:11.5px;color:rgba(255,255,255,.82);line-height:1.7;\">\n          1 \u00b7 Fixed order: Header \u2192 TL;DR \u2192 01 \u2192 02 \u2192 03 \u2192 04 \u2192 05 + footer.<br>\n          2 \u00b7 Pick exactly one block per beat, only from this catalog.<br>\n          3 \u00b7 TL;DR is fixed; Header + Footer are always dark; 04 is always light.<br>\n          4 \u00b7 Apply the transition system (color handoff \u00b7 numbered nodes \u00b7 neutral hairline between beats; gradient under the header only).<br>\n          5 \u00b7 One Letter page, 960px wide. Every section scannable in \u226420s.\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;font-weight:700;color:#8FB4FF;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;\">Example recipe<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;font-family:monospace;font-size:12px;color:#fff;line-height:1.9;\">\n          HdrB \u00b7 TL;DR \u00b7 01B \u00b7 02A \u00b7 03A \u00b7 04A \u00b7 05A \u00b7 FtrB\n        <\u002Fdiv>\n        <div style=\"font-size:10.5px;color:rgba(255,255,255,.6);line-height:1.5;margin-top:10px;\">Full build rules, the decision table, and slot definitions live in <b style=\"font-weight:700;color:#fff;\">One-Pager Skill.md<\u002Fb>.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
